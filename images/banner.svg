<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="科幻风进度条 Sci-Fi Style Progress Bar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="fill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.55" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <clipPath id="track"><rect x="0" y="0" width="700" height="18" rx="9"/></clipPath>
    <filter id="glow" x="-60%" y="-80%" width="220%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <g stroke="#1E293B" stroke-width="1" opacity="0.5">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M100 0V340M200 0V340M300 0V340M400 0V340M500 0V340M600 0V340M700 0V340M800 0V340M900 0V340M1000 0V340M1100 0V340"/>
  </g>

  <text x="80" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="600" fill="#475569" letter-spacing="7">SCI-FI STYLE PROGRESS BAR · v2.0.0</text>

  <text x="76" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="4">科幻风进度条</text>

  <text x="80" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#94A3B8">机器人领跑 · 科幻蓝渐变到代码绿 · 纯矢量绘制，零外部资源</text>

  <g transform="translate(80, 288)">
    <rect x="0" y="0" width="700" height="18" rx="9" fill="#3C3F41"/>
    <g clip-path="url(#track)">
      <rect x="0" y="0" width="434" height="18" fill="url(#fill)"/>
      <rect x="0" y="0" width="434" height="8.1" fill="#FFFFFF" opacity="0.216"/>
    </g>
    <g filter="url(#glow)">
      <g transform="translate(434, 9) scale(1.6)">
        <ellipse cx="0" cy="4.2" rx="4.5" ry="1.1" fill="#000000" opacity="0.176"/>
        <path d="M0 -6.6V-9.2" stroke="#333842" stroke-width="0.9" stroke-linecap="round"/>
        <circle cx="0" cy="-9.3" r="1.3" fill="#333842"/>
        <rect x="-5.2" y="-6.8" width="10.4" height="7.6" rx="2.6" fill="#FFFFFF" stroke="#333842" stroke-width="0.9"/>
        <rect x="-4" y="-5.2" width="2.2" height="2.4" rx="1" fill="#1F2937"/>
        <rect x="1.8" y="-5.2" width="2.2" height="2.4" rx="1" fill="#1F2937"/>
        <path d="M-1.8 -0.3A1.8 1.1 0 0 1 1.8 -0.3" fill="none" stroke="#333842" stroke-width="0.7" stroke-linecap="round"/>
        <rect x="-3.8" y="0.4" width="7.6" height="5" rx="1.8" fill="#FFFFFF" stroke="#333842" stroke-width="0.7"/>
        <rect x="-3.2" y="2.2" width="6.4" height="1.5" rx="0.8" fill="#10B981"/>
        <rect x="-5.8" y="0.6" width="1.9" height="3.6" rx="0.9" fill="#FFFFFF" stroke="#333842" stroke-width="0.7"/>
        <rect x="3.9" y="0.6" width="1.9" height="3.6" rx="0.9" fill="#FFFFFF" stroke="#333842" stroke-width="0.7"/>
      </g>
    </g>
    <text x="716" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#64748B">62%</text>
  </g>
</svg>
